<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#070b13"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 8 Vertical Signal Bars -->
  <g fill="#ffffff">
    <!-- Bar 1 -->
    <rect x="151" y="190" width="14" height="40" rx="7"/>
    <!-- Bar 2 -->
    <rect x="179" y="177" width="14" height="66" rx="7"/>
    <!-- Bar 3 -->
    <rect x="207" y="164" width="14" height="92" rx="7"/>
    <!-- Bar 4 -->
    <rect x="235" y="151" width="14" height="118" rx="7"/>
    <!-- Bar 5 -->
    <rect x="263" y="138" width="14" height="144" rx="7"/>
    <!-- Bar 6 -->
    <rect x="291" y="125" width="14" height="170" rx="7"/>
    <!-- Bar 7 -->
    <rect x="319" y="112" width="14" height="196" rx="7"/>
    <!-- Bar 8 -->
    <rect x="347" y="99" width="14" height="222" rx="7"/>
  </g>

  <!-- Typography -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">EASY TRADERS</text>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="7">EVERYTHING IS POSSIBLE</text>
</svg>
