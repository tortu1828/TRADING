<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background & Outer Rings -->
  <circle cx="200" cy="200" r="195" fill="#0c121e" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#ffffff" stroke-width="4.5" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />

  <!-- Ascending Wedge Bars Graphic (Icon) -->
  <g fill="#ffffff">
    <!-- Bar 1 -->
    <rect x="152" y="174" width="7" height="32" rx="3.5" />
    <!-- Bar 2 -->
    <rect x="165" y="163" width="7" height="54" rx="3.5" />
    <!-- Bar 3 -->
    <rect x="178" y="152" width="7" height="76" rx="3.5" />
    <!-- Bar 4 -->
    <rect x="191" y="141" width="7" height="98" rx="3.5" />
    <!-- Bar 5 -->
    <rect x="204" y="130" width="7" height="120" rx="3.5" />
    <!-- Bar 6 -->
    <rect x="217" y="119" width="7" height="142" rx="3.5" />
    <!-- Bar 7 -->
    <rect x="230" y="108" width="7" height="164" rx="3.5" />
    <!-- Bar 8 -->
    <rect x="243" y="97" width="7" height="186" rx="3.5" />
  </g>

  <!-- Typography: EASY TRADERS -->
  <text 
    x="200" 
    y="312" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, sans-serif" 
    font-size="29" 
    font-weight="900" 
    letter-spacing="4.5" 
    fill="#ffffff"
