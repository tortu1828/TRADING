    EASY TRADERS
  </text>

  <!-- Slogan: EVERYTHING IS POSSIBLE -->
  <text 
    x="200" 
    y="335" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, sans-serif" 
    font-size="9" 
    font-weight="700" 
    letter-spacing="5" 
    fill="#ffffff" 
    opacity="0.95"
  >
    EVERYTHING IS POSSIBLE
  </text>
</svg>
